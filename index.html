<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minesweeper</title>
  <meta name="description" content="A simple Minesweeper game you can play in your browser.">
  <meta name="theme-color" content="#1f2430">
  <!-- Tab icon: an SVG emoji icon built into the page, no extra file needed -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231f2430'/><text x='50' y='70' font-size='62' text-anchor='middle'>💣</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Minesweeper</h1>

    <div class="controls">
      <select id="difficulty" aria-label="Difficulty">
        <option value="easy">Easy (9×9, 10 mines)</option>
        <option value="medium">Medium (12×12, 25 mines)</option>
        <option value="hard">Hard (16×16, 40 mines)</option>
      </select>
      <button id="flagMode" type="button">🚩 Flag mode: off</button>
    </div>

    <div class="status">
      <span>💣 <span id="mines">10</span></span>
      <button id="restart" type="button" aria-label="Restart game">🙂</button>
      <span>⏱ <span id="timer">0</span></span>
    </div>

    <div id="board" class="board"></div>

    <p id="message" class="message"></p>
    <p class="hint">Left click: reveal · Right click: flag (or use Flag mode on phones)</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
